# Reviewed catalog index. Provider packages remain the source of truth.
# Add an entry only after the package passes the AGENTS.md completion gate.

[registry]
format = 1
name = "AI-Direct IR Providers"

[[provider]]
name = "ai-direct:sha256"
version = "0.1.0"
path = "providers/sha256"
upstream = "sha2 0.10.9 (RustCrypto)"
kind = "component"
wasi = []

[[provider]]
name = "ai-direct:text-width"
version = "0.1.0"
path = "providers/text-width"
upstream = "unicode-width 0.2.2 (unicode-rs)"
kind = "component"
wasi = []

[[provider]]
name = "ai-direct:base64"
version = "0.1.0"
path = "providers/base64"
upstream = "RFC 4648"
kind = "component"
wasi = []

[[provider]]
name = "ai-direct:sqlite"
version = "0.1.0"
path = "providers/sqlite"
upstream = "rusqlite 0.32.1 + libsqlite3-sys 0.30.1 (SQLite 3.46.0)"
kind = "component"
wasi = ["filesystem", "clocks", "random", "cli"]
